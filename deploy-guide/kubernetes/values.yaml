# Default values for the funnel-gdi chart.
# Every placeholder below (<angle-bracket> values) must be replaced before
# a real install — see ../../DEPLOYMENT.md, Option 2, for the full walkthrough.
# Everything else works as-is for a first try on a test namespace.

# Image used for the server Deployment and for every per-task worker Job:
# a release image ghcr.io/cerit-sc/funnel-gdi:<version> (see CHANGELOG-GDI.md;
# use the version matching appVersion in Chart.yaml), or an image you built
# and pushed from the repo root (see DEPLOYMENT.md).
image: <registry>/<registry-user>/funnel-gdi:<tag>

# Name of a `kubernetes.io/dockerconfigjson` Secret (already created in
# this namespace) the cluster should use to pull `image` above. Required
# whenever that image lives in a private registry/repository/namespace.
# Leave empty ("") for a public image.
# See DEPLOYMENT.md for the `kubectl create secret docker-registry` command.
imagePullSecret: ""

# Compute backend. "kubernetes" runs each task as its own Job — this is
# the only backend this chart's config files are written for.
compute: kubernetes

funnel:
  # ServiceAccount used by BOTH the server pod and every per-task worker
  # pod it creates. Created automatically when rbac.create is true.
  serviceAccount: funnel-sa
  runAsUser: 1000
  seccompProfile: true
  resources:
    limits:
      cpu: 2
      memory: 4Gi
      ephemeral-storage: 25Gi
    requests:
      cpu: 100m
      memory: 4Gi
      ephemeral-storage: 25Gi

# Resource limits of the per-task executor containers (the task's own image).
# Requests come from the task's own resources (cpu_cores, ram_gb, disk_gb);
# a task asking for more than these limits (or more than the worker limits,
# 1 CPU / 1G, in files/funnel-server-config.yml) cannot be started.
executor:
  limits:
    cpu: 1000m
    memory: 5G

# Creates the ServiceAccount/Role/RoleBinding this chart needs (see
# templates/serviceaccount.yaml, role.yaml, rolebinding.yaml), plus the
# ClusterRole/ClusterRoleBinding for PersistentVolumes when pvcMode is "full".
# Set to false if your cluster admin creates these for you separately — in
# that case funnel.serviceAccount above must name whatever they created.
rbac:
  create: true

# Shared PVC mounted by the server (BoltDB task database) and, in pvcMode
# "shared", by every task. Needs ReadWriteMany since the server and task
# pods mount it at the same time.
pvc:
  name: storage
  # true = use a PVC you created yourself (named pvc.name) instead of
  # creating one with this chart.
  existing: false
  storageClass: <your-rwx-storage-class>   # e.g. nfs-csi
  size: 2Gi

# How per-task storage is provisioned (Funnel's Kubernetes.PVCMode):
#   "shared" (default) - nothing per task; every task mounts pvc.name above,
#            isolated by subPath. Needs only namespaced RBAC.
#   "pvc"  - a dedicated PVC per task, dynamically provisioned from
#            storageClassName (falls back to pvc.storageClass). Needs a
#            ReadWriteMany StorageClass and only namespaced RBAC.
#   "full" - upstream behaviour: a PV (S3 Mountpoint CSI driver, uses
#            s3.bucket/s3.region) + PVC per task. Needs the S3 CSI driver and
#            a ClusterRole for persistentvolumes, which you usually can't
#            create yourself on a shared cluster.
pvcMode: shared
storageClassName: ""

# Fallback/admin credentials for HTTP Basic Auth (works out of the box).
# The same credentials are used by the workers to report back to the
# server over RPC. Change the password before a real deployment.
basicauth:
  user: admin
  password: <choose-a-strong-password>

# Optional OIDC login for the web UI / API, layered on top of BasicAuth.
# Leave disabled to get started; enable once you have an OIDC client
# registered with your identity provider. RedirectURL must end in
# "/login" and point at the host you set under `ingress` below.
oidc:
  enabled: false
  url: <https://your-oidc-provider/.well-known/openid-configuration>
  redirecturl: <https://funnel.your-domain.example/login>
  clientid: <oidc-client-id>
  clientsecret: <oidc-client-secret>
  audience: ""   # optional

# S3-compatible object storage for task inputs/outputs. Needed whenever tasks
# have outputs to keep: file:// outputs do not survive the task on Kubernetes.
# Leave disabled only if tasks have no outputs and use inline/HTTP/GA4GH
# inputs. bucket/region are only needed for pvcMode "full".
s3:
  disabled: true
  endpoint: <https://your-s3-endpoint>
  key: <s3-access-key>
  secret: <s3-secret-key>
  bucket: ""
  region: ""

# GA4GH input storage (HTSGETStorage / SDAStorage). Leave serviceurl empty
# to disable the backend. SDA inputs use the Bearer token of the user who
# submitted the task (OIDC), so SDA is only useful with oidc.enabled.
htsget:
  serviceurl: ""   # e.g. https://htsget.your-domain.example/
sda:
  serviceurl: ""   # e.g. http://sai-download:8443/

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: <your-cluster-issuer>   # e.g. letsencrypt-prod
  host: <funnel.your-domain.example>
