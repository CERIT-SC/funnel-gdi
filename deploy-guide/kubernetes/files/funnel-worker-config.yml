{{- include "funnel.validate" . -}}
# Funnel worker config (one worker Job per task). With Database "boltdb" the
# worker reads the task from, and reports events to, the server over RPC.
Database: boltdb

Compute: {{ .Values.compute }}

Logger:
  Level: debug

# GA4GH inputs: htsget://{reads|variants}/... and sda://dataset/path.
# A backend is enabled only when its ServiceURL is set (see values.yaml).
HTSGETStorage:
  ServiceURL: {{ .Values.htsget.serviceurl | quote }}
  Timeout:
    duration: 30s

SDAStorage:
  ServiceURL: {{ .Values.sda.serviceurl | quote }}
  Timeout:
    duration: 30s

GenericS3:
  - Disabled: {{ .Values.s3.disabled }}
    Endpoint: {{ .Values.s3.endpoint | quote }}
    Key: {{ .Values.s3.key | quote }}
    Secret: {{ .Values.s3.secret | quote }}
    Bucket: {{ .Values.s3.bucket | quote }}
    Region: {{ .Values.s3.region | quote }}

AmazonS3:
  Disabled: true

RPCClient:
  MaxRetries: 3
  Timeout:
    duration: 30s
  Credential:
    User: {{ .Values.basicauth.user | quote }}
    Password: {{ .Values.basicauth.password | quote }}

EventWriters:
  - rpc
  - log

# Address of the Funnel server (the chart's Service) for RPC.
Server:
  HostName: {{ .Release.Name }}
  RPCPort: "9090"

Kubernetes:
  Executor: "kubernetes"
  Namespace: {{ .Release.Namespace }}
  JobsNamespace: {{ .Release.Namespace }}
  # Must match the server config: decides which PVC the executor mounts.
  PVCMode: {{ .Values.pvcMode | quote }}
  SharedPVCName: {{ .Values.pvc.name | quote }}
  # Executor Job, one per task executor. The "app: funnel-executor" label is
  # required: orphan cleanup finds executor Jobs by it.
  ExecutorTemplate: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: {{`{{.TaskId}}-{{.JobId}}`}}
      namespace: {{`{{.JobsNamespace}}`}}
      labels:
        app: funnel-executor
        job-name: {{`{{.TaskId}}-{{.JobId}}`}}
    spec:
      backoffLimit: 0
      completions: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: {{ .Values.funnel.runAsUser }}
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: funnel-executor-{{`{{.TaskId}}`}}
            image: {{`{{.Image}}`}}
            imagePullPolicy: Always
            {{`{{- if .UseShell}}`}}
            command: ["/bin/sh", "-c"]
            args:
            - {{`{{printf "%q" (index .Command 0)}}`}}
            {{`{{- else}}`}}
            command:
            {{`{{- range .Command}}`}}
            - {{`{{printf "%q" .}}`}}
            {{`{{- end}}`}}
            {{`{{- end}}`}}
            {{`{{- if .Workdir}}`}}
            workingDir: {{`{{.Workdir}}`}}
            {{`{{- end}}`}}
            {{`{{- if .Env}}`}}
            env:
            {{`{{- range $key, $value := .Env}}`}}
            - name: {{`{{$key}}`}}
              value: {{`{{printf "%q" $value}}`}}
            {{`{{- end}}`}}
            {{`{{- end}}`}}
            resources:
              requests:
                cpu: {{`{{if ne .Cpus 0 -}}{{.Cpus}}{{ else }}{{"100m"}}{{end}}`}}
                memory: {{`{{if ne .RamGb 0.0 -}}{{printf "%.0fG" .RamGb}}{{else}}{{"16M"}}{{end}}`}}
                ephemeral-storage: {{`{{if ne .DiskGb 0.0 -}}{{printf "%.0fG" .DiskGb}}{{else}}{{"100M"}}{{end}}`}}
              limits:
                {{- toYaml .Values.executor.limits | nindent 16 }}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            volumeMounts:
{{- if eq .Values.pvcMode "shared" }}
            # /shared is a directory shared by all tasks (pvcMode "shared" only).
            - name: storage
              mountPath: /shared
              subPath: shared
{{- end }}
            ### DO NOT CHANGE THIS: task inputs/outputs/volumes
            {{`{{- if .NeedsPVC }}`}}
            {{`{{- range $idx, $item := .Volumes}}`}}
            - name: storage
              mountPath: {{`{{$item.ContainerPath}}`}}
              subPath: {{`{{$.TaskId}}{{$item.ContainerPath}}`}}
            {{`{{- end}}`}}
            {{`{{- end}}`}}
          volumes:
{{- if eq .Values.pvcMode "shared" }}
          - name: storage
            persistentVolumeClaim:
              claimName: {{`{{.PVCName}}`}}
{{- else }}
          {{`{{- if .NeedsPVC }}`}}
          - name: storage
            persistentVolumeClaim:
              claimName: {{`{{.PVCName}}`}}
          {{`{{- end }}`}}
{{- end }}
