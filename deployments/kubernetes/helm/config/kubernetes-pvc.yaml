# Worker/Executor PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: funnel-pvc-{{.TaskId}}
  namespace: {{ .Namespace }}
  labels:
    app: funnel
    taskId: {{.TaskId}}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  {{- if .StorageClassName}}
  storageClassName: {{.StorageClassName}}
  {{- else}}
  volumeName: funnel-pv-{{.TaskId}}
  {{- end}}
