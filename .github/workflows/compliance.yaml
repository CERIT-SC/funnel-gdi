# Workflow for running the TES compliance suite against Funnel
#
# This includes the following steps:
#  1. Build Funnel and store the resulting binary artifact
#  2. Install tes-compliance-suite and run against every version of TES simultaneously
#  3. start-report-deployment: Send a dispatch to the funnel-compliance repository to generate and publish
#     the tes-compliance-suite report to https://ohsu-comp-bio.github.io/funnel-compliance/
#
# Optionally debug via SSH
# Ref: https://fleetdm.com/engineering/tips-for-github-actions-usability
#
# To use this step uncomment and place anywhere in the build steps. The build will pause on this step and
# output a ssh address associated with the Github action worker. Helpful for debugging build steps and
# and intermediary files/artifacts.
#
# - name: Setup tmate session
#   uses: mxschmitt/action-tmate@v3

name: Compliance Test

# Called by acceptance.yaml, which builds the coverage-instrumented binary
# (artifact "funnel-cover") and merges the coverage of all acceptance tests.
on:
  workflow_call:

jobs:
  compliance:
    strategy:
      fail-fast: false
      matrix:
        version:
          - 1.0.0
          - 1.1.0
        # "local" is the default BoltDB database
        db:
          - local
          - postgres
        # Temporary: Only test local compute backend until we bring up a K8s cluster in Github Actions
        # compute: ["local", "kubernetes"]
        compute:
          - local
        storage:
          - local
          - s3
    runs-on: ubuntu-latest
    steps:
      # Required to access the tests config files (e.g. tests/postgres.config.yml)
      # Perhaps uploading it as an artifact would be more efficient?
      - name: Check out code
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: funnel-cover

      # For "go tool covdata"
      - name: Set up Go 1.x
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Start Funnel server
        run: |
          touch config.yml

          if [ ${{ matrix.db }} = "postgres" ]; then
            make start-postgres
            for i in $(seq 1 30); do
              docker exec funnel-postgres-test pg_isready -U postgres && break
              echo "Waiting for Postgres... ($i/30)"
              sleep 1
              [ $i -eq 30 ] && { echo "Postgres did not become ready in time"; exit 1; }
            done
            cat `pwd`/tests/postgres.config.yml >> config.yml
          fi

          if [ ${{ matrix.storage }} = "s3" ]; then
            make start-s3
            cat `pwd`/tests/minio-s3.config.yml >> config.yml
          fi

          if [ ${{ matrix.compute }} = "kubernetes" ]; then
            kubectl apply -f tests/k8s
            cat `pwd`/tests/k8s.config.yml >> config.yml
          fi

          chmod +x funnel
          # The binary is built with -cover: it writes coverage data to
          # GOCOVERDIR when it exits normally (see "Stop Funnel").
          mkdir -p covdata
          GOCOVERDIR=`pwd`/covdata ./funnel server run --config `pwd`/config.yml &> funnel.logs &
          echo $! > funnel.pid

      - name: Wait for Funnel to be ready
        run: |
          for i in $(seq 1 10); do
            if ! kill -0 $(cat funnel.pid) 2>/dev/null; then
              echo "Funnel process exited unexpectedly:"
              cat funnel.logs
              exit 1
            fi
            curl -sf http://localhost:8000/v1/service-info && exit 0
            echo "Waiting for Funnel... ($i/10)"
            sleep 1
          done
          echo "Funnel did not become ready in time:"
          cat funnel.logs
          exit 1

      - name: Run OpenAPI Test Runner
        run: |
          git clone https://github.com/elixir-cloud-aai/openapi-test-runner
          cd openapi-test-runner
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          python setup.py install
          output=$(openapi-test-runner report --version "${{ matrix.version }}" --server "http://localhost:8000/" 2>&1)
          echo "$output"
          echo "$output" | grep -q "Failed - 0" || { echo "Compliance tests failed"; exit 1; }

      - name: Stop Funnel
        if: always()
        run: |
          pid=$(cat funnel.pid)
          kill -INT "$pid" 2>/dev/null || exit 0
          for i in $(seq 1 30); do
            kill -0 "$pid" 2>/dev/null || exit 0
            sleep 1
          done
          echo "Funnel did not stop within 30 s; no coverage data will be written"
          kill -KILL "$pid"

      - name: Coverage profile
        if: always()
        run: |
          mkdir -p coverage
          if ! ls covdata/covcounters.* > /dev/null 2>&1; then
            echo "::warning::No coverage data: Funnel did not exit normally (killed or crashed)."
            exit 0
          fi
          go tool covdata textfmt -i=covdata \
            -o=coverage/compliance-${{ matrix.version }}-${{ matrix.db }}-${{ matrix.compute }}-${{ matrix.storage }}.out

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-acceptance-compliance-${{ matrix.version }}-${{ matrix.db }}-${{ matrix.compute }}-${{ matrix.storage }}
          path: coverage/*.out
          if-no-files-found: ignore
