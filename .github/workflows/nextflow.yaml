name: Nextflow Test

# Called by acceptance.yaml, which builds the coverage-instrumented binary
# (artifact "funnel-cover") and merges the coverage of all acceptance tests.
on:
  workflow_call:

jobs:
  nextflow:
    runs-on: ubuntu-latest
    steps:
    - name: Download Funnel
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: funnel-cover

    # For "go tool covdata"
    - name: Check out code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        path: src

    - name: Set up Go 1.x
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: src/go.mod
        cache: false

    - name: Start Funnel
      run: |
        chmod +x ./funnel
        # The binary is built with -cover: it writes coverage data to
        # GOCOVERDIR when it exits normally (see "Stop Funnel").
        mkdir -p covdata
        GOCOVERDIR=`pwd`/covdata ./funnel server --LocalStorage.AllowedDirs $HOME run &> funnel.logs &
        echo $! > funnel.pid
    
    - name: Setup Java
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Nextflow
      run: |
        echo "Installing Nextflow: https://www.nextflow.io/docs/latest/install.html"

        # Install Java 17
        curl -s https://get.sdkman.io | bash
        source "/home/runner/.sdkman/bin/sdkman-init.sh"
        sdk install java 17.0.10-tem
        java -version

        # Install Nextflow
        curl -s https://get.nextflow.io | bash
        chmod +x nextflow
        mkdir -p $HOME/.local/bin/
        mv nextflow $HOME/.local/bin/

        # Ensure Nextflow is in PATH
        export PATH=$HOME/.local/bin:$PATH
        echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV

        nextflow info

    - name: Install nf-canary and GA4GH-TES plugin
      run: |
        # Pinned: a new nf-canary commit can add parameters or processes.
        git clone https://github.com/seqeralabs/nf-canary
        git -C nf-canary checkout --quiet c4a8d4232f3fd2cb2522519c646fb08d408036ba
        cd nf-canary
        cat <<EOF >> nextflow.config
          plugins {
            id 'nf-ga4gh'
          }
          process.executor = 'tes'
          tes.endpoint = 'http://localhost:8000'
        EOF

    - name: Run nf-canary tests
      run: |
        nextflow run nf-canary/main.nf

    - name: Stop Funnel
      if: always()
      run: |
        pid=$(cat funnel.pid)
        kill -INT "$pid" 2>/dev/null || exit 0
        for i in $(seq 1 30); do
          kill -0 "$pid" 2>/dev/null || exit 0
          sleep 1
        done
        echo "Funnel did not stop within 30 s; no coverage data will be written"
        kill -KILL "$pid"

    - name: Coverage profile
      if: always()
      run: |
        mkdir -p coverage
        if ! ls covdata/covcounters.* > /dev/null 2>&1; then
          echo "::warning::No coverage data: Funnel did not exit normally (killed or crashed)."
          exit 0
        fi
        go tool covdata textfmt -i=covdata -o=coverage/nextflow.out

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-acceptance-nextflow
        path: coverage/*.out
        if-no-files-found: ignore
