name: Git Tag

# Push events to every tag not containing '/':
on:
  push:
    tags:
      - "*"
  # Allows manual runs from the Actions tab
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish to ghcr.io (e.g. manual-test)"
        required: true
        type: string

jobs:

  # Whenever a Git tag is created (in any branch containing this workflow file),
  # this job automatically publishes an image: ghcr.io/<user/repo>:<git-tag>.
  # Currently the image is built for linux/amd64 and linux/arm64.

  docker-image-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for the Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
