name: Git Tag

# Push events to every tag not containing '/':
on:
  push:
    tags:
      - "*"
  # Allows manual runs from the Actions tab
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish to ghcr.io (e.g. manual-test)"
        required: true
        type: string

jobs:

  # For release tags (X.Y.Z.N, see RELEASING.md) the documentation must name
  # the released version, otherwise no image or release is published. Other
  # tags only build an image.
  docs-version-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check documentation version
        id: check
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            scripts/check-docs-version.sh "$GITHUB_REF_NAME"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "$GITHUB_REF_NAME is not a release tag (X.Y.Z.N), skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # Whenever a Git tag is created (in any branch containing this workflow file),
  # this job automatically publishes an image: ghcr.io/<user/repo>:<git-tag>.
  # Currently the image is built for linux/amd64 and linux/arm64.

  docker-image-push:
    needs: docs-version-check
    # Also runs when docs-version-check is skipped (manual workflow_dispatch).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for the Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  # Publishes a GitHub Release for release tags, with release notes generated
  # from the merged pull requests and links to the documentation at that tag.
  github-release:
    needs: [docs-version-check, docker-image-push]
    if: needs.docs-version-check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$tag"
          {
            echo "### Documentation for this version"
            echo "- [README]($repo_url/blob/$tag/README.md)"
            echo "- [Deployment guide, system requirements, supported platforms]($repo_url/blob/$tag/DEPLOYMENT.md)"
            echo
            echo "### Container image"
            echo "\`$image\` (linux/amd64, linux/arm64)"
          } > release-notes.md
          gh release create "$tag" --title "$tag" --generate-notes --notes-file release-notes.md
