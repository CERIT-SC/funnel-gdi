name: Documentation

# Keeps the documentation consistent: the documentation site builds and has no
# broken internal links (published by pages.yaml after the merge).
on:
  pull_request:
    branches:
      - master

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go (for Hugo modules)
        uses: actions/setup-go@v5
        with:
          go-version-file: website/go.mod
          cache: false

      - name: Install Hugo
        run: |
          wget -q -O "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - name: Build the documentation site
        env:
          DEV_ONLY: 1
          PAGEFIND: 0
        run: website/scripts/build-versions.sh build/pages

      - name: Check links
        run: python3 website/scripts/check-links.py build/pages
